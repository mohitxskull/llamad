[package]
name = "llamad"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "CPU-first in-process GGUF inference: slotted KV-cache batching, prefix reuse, grammars, streaming, and a local-IPC daemon"
repository = "https://github.com/mohitxskull/llamad"
readme = "README.md"
keywords = ["llama", "gguf", "llm", "inference", "daemon"]
categories = ["api-bindings", "science", "concurrency"]
# Model fixtures are multi-hundred-MB GGUFs fetched by models/download.sh,
# which itself ships so a downstream checkout can run the real-model suite.
exclude = ["models/*.gguf"]

[features]
# `bin` is on by default so `cargo run -- model.gguf` works in a checkout.
# Library consumers should set `default-features = false` to drop the daemon's
# argument/logging dependencies.
#
# No acceleration backend is enabled by default: the resulting build is
# portable to any machine with the same target triple. Every backend below is
# opt-in because each one either pins the binary to the build host (`native`)
# or requires a matching toolchain/driver on the build machine.
default = ["bin"]

# Extra dependencies for the daemon binary (src/main.rs).
bin = [
    "dep:anyhow",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
]

# `-march=native`: enables host-specific SIMD (AVX-512/AVX2/FMA). Substantially
# faster, but the resulting binary may SIGILL on any other CPU model.
native = ["llama-cpp-4/native"]
# OpenMP threading inside ggml (llama-cpp-4 enables this in its own defaults;
# opt-in here so the default build needs no external toolchain).
openmp = ["llama-cpp-4/openmp"]
# Download a prebuilt generic x86-64 ggml instead of compiling llama.cpp.
prebuilt = ["llama-cpp-4/prebuilt"]
cuda = ["llama-cpp-4/cuda"]
metal = ["llama-cpp-4/metal"]
vulkan = ["llama-cpp-4/vulkan"]
hip = ["llama-cpp-4/hip"]
blas = ["llama-cpp-4/blas"]

[dependencies]
llama-cpp-4 = { version = "0.4.4", default-features = false }
# Only for the `ggml_log_level` type and its level constants in the tracing log
# callback; the `llama_log_set` call itself goes through `llama_cpp_4::log_set`.
# Resolves to the same version llama-cpp-4 depends on (both require ^0.4.4).
llama-cpp-sys-4 = { version = "0.4.4", default-features = false }
tokio = { version = "1", features = ["net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
num_cpus = "1"

# Binary-only. Gated behind `bin` so a library consumer does not pull an error
# wrapper and a log subscriber into its dependency graph.
anyhow = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

[[bin]]
name = "llamad"
path = "src/main.rs"
required-features = ["bin"]

# Dependencies (especially llama.cpp/ggml) build in dev mode with full
# debuginfo, which balloons target/debug. Optimizing deps keeps the daemon
# fast to run and slashes target-dir size without affecting our own
# debuggability.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.docs.rs]
# Drop the `bin` feature: the daemon's argument/logging dependencies add
# nothing to the API docs, and fewer dependencies means a better chance of
# finishing inside the docs.rs time limit. No acceleration backend is selected
# either — the docs.rs sandbox has no CUDA/Metal/ROCm toolchain.
#
# This is still a full llama.cpp C++ build from source via llama-cpp-sys-4, so
# the docs build is heavy and may time out. Verify the docs render after the
# first publish; if they do not, host them separately rather than weakening the
# crate's dependencies for the sake of docs.rs.
no-default-features = true

[lints.rust]
# Unsafe discipline, enforced by the compiler rather than by review. The crate
# already complies — every `unsafe` operation sits in an explicit block, and
# there are no redundant ones — so these cost nothing today and prevent the
# discipline from eroding. `deny`, not `warn`: unlike a clippy lint, these are
# rustc lints whose meaning is fixed, so denying them cannot be broken by a
# later toolchain adding diagnostics.
#
# `invalid_reference_casting` is deliberately absent: rustc already denies it
# by default, and restating it would imply the others are similarly redundant.
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
# `warn`, not `deny`: a future clippy release that adds a lint must not break
# downstream builds. CI runs `cargo clippy -- -D warnings` to keep this clean.
all = "warn"

[workspace]

[dev-dependencies]
serial_test = "4.0.1"
# Property tests for the UTF-8 reassembly and stop-sequence logic — the two
# places where the example-based tests can only cover the cases someone thought
# of, and where the failure mode (a panic on a char boundary, a silently
# dropped fragment) is exactly what random inputs are good at finding.
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
