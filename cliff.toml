# git-cliff configuration — generates CHANGELOG.md and GitHub release notes
# from Conventional Commits. See https://git-cliff.org/docs/configuration
#
# Usage:
#   git cliff --unreleased --prepend CHANGELOG.md   # fold new commits in
#   git cliff --latest --strip header               # release-note body
#
# The CI release workflow runs the second form; the first is a release-time
# step documented in README.md ("Releasing").

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} **(breaking)**{% endif %}\
{% endfor %}
{% endfor %}

"""

footer = """

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/mohitxskull/llamad/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/mohitxskull/llamad/releases/tag/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
# Non-conventional commits are dropped rather than dumped into a catch-all
# group, so a stray "wip" never lands in a published changelog.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^security", group = "Security" },
  # Housekeeping that users of the crate cannot observe.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^build", group = "Build" },
]
