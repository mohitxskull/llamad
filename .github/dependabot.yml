version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Maintain dependencies for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # proptest >= 1.12 pulls in borsh -> syn 3, breaking bindgen (which links prettyplease on syn 2)
      - dependency-name: "proptest"
        versions: [">= 1.12.0"]
