# Mutation testing: does the suite actually catch a wrong answer, or does it
# merely execute the line?
#
# Runs here rather than on a developer machine for two reasons. It is slow —
# the crate is rebuilt once per mutant, and llama.cpp is compiled from source.
# And it is memory-hungry in a way that is easy to get wrong: cargo-mutants
# builds in $TMPDIR, /tmp is a tmpfs on most Linux desktops, and a ~6 GB build
# tree written into RAM will take a workstation down. GitHub runners have a
# disk-backed /tmp, so the default is safe here; `scripts/mutants.sh` is what
# makes a local run safe.
#
# Never on push or pull_request: a ~40 minute job on every merge is a job
# people learn to ignore.
name: Mutants

on:
  workflow_dispatch:
  schedule:
    # Sundays, 04:00 UTC. Drift in test quality is slow; weekly is enough to
    # notice it without anyone having to remember to look.
    - cron: "0 4 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - uses: taiki-e/install-action@cargo-mutants

      # Two runs were killed ~60 seconds into testing mutants with "the runner
      # has received a shutdown signal". The first guess was disk; the log
      # disproved it — the runner had 88 GB free before any cleanup. It is
      # memory: every test binary here links llama.cpp's static library, and
      # cargo-mutants builds across NCPUS by default, so several concurrent
      # links exhaust a 16 GB runner and the agent is killed.
      #
      # Serial builds fix it. The same limit is the default in
      # scripts/mutants.sh, where `--jobserver-tasks 3` tripped a local memory
      # watchdog partway through a run.
      # `continue-on-error`, deliberately. Survivors are expected: the test
      # command is `cargo test --lib` (see .cargo/mutants.toml), so anything
      # only reachable with a GGUF loaded — most of the decode loop — survives
      # for lack of coverage rather than because a test is weak. Failing the
      # job on that would make it permanently red and therefore ignored. The
      # report is the output; read it, do not just check the badge.
      - name: Mutation audit
        id: mutants
        continue-on-error: true
        run: cargo mutants --no-shuffle --jobserver-tasks 1

      # The full lists matter more than the exit status — `missed.txt` is the
      # one to read, and `unviable.txt` explains anything that failed to build.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo '### Mutation audit'
            echo
            for f in caught missed unviable timeout; do
              if [ -s "mutants.out/$f.txt" ]; then
                echo "**$(wc -l < "mutants.out/$f.txt") $f**"
              fi
            done
            echo
            if [ -s mutants.out/missed.txt ]; then
              echo 'Mutants no test caught — each is either a real gap or an equivalent mutant:'
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
