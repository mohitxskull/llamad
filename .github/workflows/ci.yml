name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Generous against a cold llama.cpp build (~10-25 min), far below the
    # 360-minute default. The point is to fail fast on a hang, not to allow a
    # long build — an actual timeout here means something is stuck.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --all

      # No acceleration feature: `native` would build for the runner's CPU,
      # and the runner fleet is heterogeneous. This is also the configuration
      # downstream consumers get by default.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # The unit suite covers the protocol, slot lifecycle, KV-reuse
      # bookkeeping, config and server without loading a model. Anything that
      # needs llama.cpp actually decoding runs in the `real-model` job.
      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        run: cargo test --doc

      # Compile (but do not run) the real-model test binaries, so an API
      # change that breaks them fails here rather than at release time.
      - name: Build integration test binaries
        run: cargo test --no-run --all-targets

      - name: Package
        run: cargo package

  # The 32 tests that load a real GGUF — prefill, KV rewind, grammar
  # constraints, stop matching against a real tokenizer. None of it is
  # reachable from the unit suite.
  #
  # Affordable because the fixtures are cached: a warm run restores ~1.4 GB
  # from GitHub's own storage in seconds rather than fetching from HuggingFace,
  # and Actions minutes are free on public repositories. A cold run (~25 min)
  # only happens after the cache is evicted, which GitHub does to entries
  # untouched for 7 days.
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Keyed on the download script, so changing a model URL or adding a
      # fixture invalidates the cache rather than silently testing the old set.
      # Pull requests restore this from main's cache; their own entries are
      # discarded when the PR closes.
      - name: Cache GGUF fixtures
        uses: actions/cache@v6
        with:
          path: models/*.gguf
          key: gguf-${{ hashFiles('models/download.sh') }}

      # Idempotent: on a cache hit this only issues HEAD requests and skips
      # files already at the server's current Content-Length. It also self-heals
      # if upstream re-uploaded a different quant under the same name.
      - name: Fetch models
        run: ./models/download.sh

      - name: Real-model tests
        run: cargo test --test integration --test lifecycle --test reuse --test cancellation

  # Proves the platform claims in the README instead of assuming them. The
  # library must build and its unit tests pass everywhere; the daemon is Unix
  # only, so on Windows `--bins` builds the stub `main` that exits with an
  # explanation rather than a link error.
  #
  # `fail-fast: false` so a macOS failure still reports the Windows result and
  # vice versa — when a platform breaks, knowing whether the other one also
  # broke is most of the diagnosis.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No acceleration feature: Metal on macOS is opt-in, and a stock build is
      # what a downstream consumer gets by default on either platform.
      - name: Build library and binary
        run: cargo build --lib --bins

      # On Windows the `server` module is cfg'd out, so its tests vanish with
      # it and the count is lower than on Unix. That is expected, not a gap.
      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        run: cargo test --doc

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # `--lib --bins`, not `--all-targets`: the MSRV is a promise about what a
      # consumer can build, and a consumer never builds our dev-dependencies.
      # `--all-targets` pulls in the test harness (serial_test 4 needs rustc
      # 1.93), which would force the declared MSRV up to satisfy a crate that
      # is never shipped. The library and the daemon binary — the things people
      # actually depend on — do build on 1.88.
      - name: Check against the declared MSRV
        run: cargo check --lib --bins

  # Supply-chain check against the RustSec advisory database.
  #
  # Scope worth knowing: `cargo audit` covers the *Rust* dependency graph from
  # Cargo.lock. It says nothing about the vendored llama.cpp/ggml C++ that
  # llama-cpp-sys-4 compiles, which is the bulk of the code this crate
  # executes. Useful, not sufficient.
  #
  # Not in the pre-commit hook: it needs the network and a `cargo install`,
  # and a hook slow enough to be annoying is a hook people bypass.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--locked` so the audit tool itself builds reproducibly.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        run: cargo audit
