name: Release

# Tagging `vX.Y.Z` publishes the crate to crates.io and then opens a GitHub
# Release whose notes are generated from the Conventional Commits since the
# previous tag.
#
# The tag is the only trigger, and deliberately so: a published version can be
# yanked but never replaced or reused, so the action that causes it should be
# one you take on purpose. A commit-message trigger would tie the most
# irreversible step to the most frequent one.
#
# Authentication prefers crates.io Trusted Publishing (OIDC), so no long-lived
# registry token need be stored here. Register the trusted publisher once at
# https://crates.io/crates/llamad/settings with:
#   repository owner:  mohitxskull
#   repository name:   llamad
#   workflow filename: release.yml
#   environment:       (leave blank, or set one and add `environment:` to the
#                       publish job below to require manual approval)
#
# That settings page only exists once the crate has been published, so the very
# first release must authenticate with a CARGO_REGISTRY_TOKEN secret instead.
# The publish job below uses the secret when it is set and OIDC otherwise —
# delete the secret after registering the trusted publisher.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can fail cheaply runs before anything irreversible.
  verify:
    runs-on: ubuntu-latest
    # Well under the 360-minute default: these are hang guards, not headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Refuse to release if the tag and the manifest disagree — the most
      # common release mistake, and silent if unchecked.
      - name: Tag matches Cargo.toml version
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version $manifest"

      # The changelog must actually mention this version. Cheap guard against
      # tagging before writing the entry.
      - name: Changelog has an entry for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section"
            exit 1
          fi

      # `--lib` and `--doc` cannot be combined (cargo: "can't mix --doc with
      # other target selecting options"), so these are separate steps.
      #
      # The 32 real-model tests are not repeated here — the `real-model` job in
      # ci.yml already ran them against this commit on main. Keeping them out
      # of the release path means a HuggingFace outage cannot block a release,
      # and the tag is only ever pushed at a commit CI has already gone green on.
      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Compiles the packaged tarball, which is what crates.io will build.
      # Catches an `exclude` that dropped a file the crate needs.
      - name: Package
        run: cargo package --locked

  # The irreversible step. Runs only after `verify`, and before the GitHub
  # Release, so a failed publish does not leave behind a release announcing a
  # version that does not exist.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # `cargo publish` re-runs a verification build of the packaged tarball,
    # which compiles llama.cpp from source. Given room, since this is the step
    # that must not be retried casually.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # required to mint the Trusted Publishing token
    env:
      # A trusted publisher is configured per crate, at
      # crates.io/crates/<name>/settings — a page that does not exist until the
      # crate has been published at least once. So the *first* release needs a
      # plain token: set the CARGO_REGISTRY_TOKEN secret for that release,
      # register the trusted publisher afterwards, then delete the secret and
      # every later release authenticates over OIDC with no stored credential.
      #
      # Evaluated here rather than in the step's `if:` because the `secrets`
      # context is not available in step-level conditionals.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    # Only git-cliff and an API call; no compilation.
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs full history and tags

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          # Pre-1.0 and pre-release tags are marked as such.
          prerelease: ${{ contains(github.ref_name, '-') }}
